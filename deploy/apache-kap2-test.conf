# /etc/apache2/sites-available/kap2-test.conf — TLS ergänzt certbot (--apache) nach dem DNS-Eintrag
<VirtualHost *:80>
    ServerName __TEST_DOMAIN__
    ServerAdmin info@lostxyouth.org
    DocumentRoot /opt/overlord/kap2/frontend/dist
    ErrorLog ${APACHE_LOG_DIR}/kap2-test.error.log
    CustomLog ${APACHE_LOG_DIR}/kap2-test.access.log combined

    <Location />
        AuthType Basic
        AuthName "KAP2 Testumgebung"
        AuthUserFile /etc/overlord/kap2-test.htpasswd
        Require valid-user
    </Location>
    <Directory /opt/overlord/kap2/frontend/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:8010/api retry=0 timeout=600
    ProxyPassReverse /api http://127.0.0.1:8010/api
</VirtualHost>
